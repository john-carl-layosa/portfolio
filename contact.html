<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>John Carl Layosa | Contact</title>
    <style>
      @media (max-width: 768px) {
        .header-right .icon {
          display: block;
          font-size: 24px;
          cursor: pointer;
        }

        .offcanvas-custom {
          position: absolute !important;
          width: 200px;
          top: 1.5rem;
          bottom: auto;
          right: 10px;
          border-radius: 10px;
          background-color: #E85A4F;
          color: #EAE7DC;
          box-shadow: 5px 5px 10px #E85A4F, -5px -5px 10px #E85A4F;
          padding: 1rem;
          display: none;
          z-index: 1050;
        }

        .offcanvas-body a {
          display: block;
          margin: 10px 0;
          color: #EAE7DC;
          text-decoration: none;
          font-family: "Source Sans 3", sans-serif;
          font-weight: bold;
        }

        .offcanvas-body a:hover {
          color: #5F5E5B;
        }

        .offcanvas.show {
          display: block !important;
        }

        .header-right > a:not(.icon) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="particles-js"></div>

    <div class="topnav px-3 py-2 d-flex justify-content-between align-items-center" id="myTopnav">
      <a href="index.html" class="logo">JC Layosa</a>
      <div class="header-right d-flex align-items-center">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="experience.html">TECH STACK</a>
        <a class="active" href="contact.html">CONTACT</a>
        <a class="icon ms-3 d-md-none" onclick="toggleMobileMenu()">
          <i class="fa fa-bars"></i>
        </a>
      </div>
    </div>

    <div class="offcanvas offcanvas-custom" id="mobileMenu">
      <div class="offcanvas-header p-0 border-0 text-end">
        <button type="button" class="btn-close btn-close-white" onclick="toggleMobileMenu()"></button>
      </div>
      <div class="offcanvas-body">
        <a href="index.html">HOME</a>
        <a href="about.html">ABOUT</a>
        <a href="experience.html">TECH STACK</a>
      </div>
    </div>

    <div class="contact-content">
      <h1 class="animate__animated animate__fadeInDown animate__delay-0s">Contact Me</h1>
      <h2 class="animate__animated animate__fadeInUp animate__delay-0s">Have any inquiries? Reach out to me!</h2>
    </div>

    <div class="wrapper animate__animated animate__flipInX animate__delay-0s">
      <a href="https://www.facebook.com/johncarl.layosa/" target="_blank" class="contact-button">
        <div class="icon">
          <i class="fa-brands fa-facebook"></i>
          <span>Facebook</span>
        </div>
      </a>
      <a href="https://www.linkedin.com/in/layosa-j-408340358" target="_blank" class="contact-button">
        <div class="icon">
          <i class="fa-brands fa-linkedin"></i>
          <span>LinkedIn</span>
        </div>
      </a>
      <a href="https://github.com/john-carl-layosa" target="_blank" class="contact-button">
        <div class="icon">
          <i class="fa-brands fa-github"></i>
          <span>GitHub</span>
        </div>
      </a>
    </div>

    <script src="particles.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleMobileMenu() {
        const menu = document.getElementById("mobileMenu");
        menu.classList.toggle("show");
      }

      document.addEventListener("click", function (event) {
        const menu = document.getElementById("mobileMenu");
        const icon = document.querySelector(".icon");
        if (!menu.contains(event.target) && !icon.contains(event.target)) {
          menu.classList.remove("show");
        }
      });
    </script>
  </body>
</html>
